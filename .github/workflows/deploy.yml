name: Deploy to GitHub Pages

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Stamp the deployed version
      run: |
        version="$(node -p "require('./package.json').version")"
        revision="$(git rev-parse --short=8 HEAD)"
        updated="$(TZ=Europe/Copenhagen date -d "@$(git show -s --format=%ct HEAD)" +%F)"
        sed -i "s|<span id=\"app-version\">local</span>|<span id=\"app-version\">${version} (${revision})</span> · Updated <time datetime=\"${updated}\">${updated}</time>|" index.html
        grep -Fq "${version} (${revision})" index.html
        sed -i "s|CACHE_VERSION = 'local'|CACHE_VERSION = '${GITHUB_SHA}'|" service-worker.js
        grep -Fq "${GITHUB_SHA}" service-worker.js

    - name: Setup Pages
      uses: actions/configure-pages@v5

    - name: Upload artifact
      uses: actions/upload-pages-artifact@v4
      with:
        path: '.'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4